{{- $a := partialCached "assets.html" . -}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
{{- with .Description | default site.Params.description }}
<meta name="description" content="{{ . }}">
{{- end }}
<link rel="canonical" href="{{ .Permalink }}">
{{- with site.Home.OutputFormats.Get "rss" }}
<link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}" title="{{ site.Title }}">
{{- end }}
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
{{- if ne .Kind "404" }}
<meta name="tt-hit" content="{{ .RelPermalink }}">
{{- end }}
<script type="application/json" id="tt-manifest">{{ dict "themes" $a.themes "copy" hugo.Data.copy "hits" ("api/hit" | relURL) | jsonify | safeJS }}</script>
<script>{{ $a.boot.Content | safeJS }}</script>
<link rel="stylesheet" href="{{ $a.css.RelPermalink }}">
