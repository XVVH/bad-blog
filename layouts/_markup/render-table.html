{{- /*
  Wide tables scroll inside their own box. Alignment uses classes, because
  the content security policy forbids inline style attributes.
*/ -}}
<div class="table-scroll" tabindex="0" role="region" aria-label="Table">
<table>
  <thead>
    {{- range .THead }}
    <tr>
      {{- range . }}
      <th{{ with .Alignment }} class="align-{{ . }}"{{ end }}>{{ .Text }}</th>
      {{- end }}
    </tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
    <tr>
      {{- range . }}
      <td{{ with .Alignment }} class="align-{{ . }}"{{ end }}>{{ .Text }}</td>
      {{- end }}
    </tr>
    {{- end }}
  </tbody>
</table>
</div>
